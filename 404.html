<!DOCTYPE html>
<html lang="es">

<head>

  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0A0A0A;
      color: #FAFAF9;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px;
      -webkit-font-smoothing: antialiased;
    }

    .eyebrow {
      font-family: 'Space Mono', monospace;
      font-size: .75rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #8A8782;
      margin-bottom: 20px;
    }

    h1 {
      font-family: 'Fraunces', serif;
      font-weight: 500;
      font-size: clamp(2.4rem, 8vw, 4.5rem);
      line-height: 1.05;
      max-width: 720px;
    }

    h1 em {
      font-style: italic;
      font-weight: 300;
      color: #E8E6E2;
    }

    p {
      color: #8A8782;
      font-size: 1rem;
      max-width: 460px;
      margin: 24px 0 36px;
      line-height: 1.6;
    }

    a.home-link {
      color: #FAFAF9;
      text-decoration: none;
      border: 1px solid rgba(250, 249, 247, 0.4);
      padding: 12px 28px;
      font-family: 'Space Mono', monospace;
      font-size: .82rem;
      letter-spacing: .03em;
      transition: background .2s ease, color .2s ease;
    }

    a.home-link:hover {
      background: #FAFAF9;
      color: #0A0A0A;
    }
  </style>
</head>

<body>
  <span class="eyebrow">Error 404</span>
  <h1>Esta página <em>no existe</em></h1>
  <p>El contenido que buscás se movió o nunca estuvo acá. Volvé al inicio para ver nuestros proyectos y servicios.</p>
