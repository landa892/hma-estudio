<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página no encontrada — Hitzig Militello Arquitectos</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/assets/logo-mark.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px;
    }

    .eyebrow {
      font-size: .75rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: #999;
      margin-bottom: 20px;
      font-weight: 700;
    }

    h1 {
      font-weight: 700;
      font-size: clamp(2.4rem, 8vw, 4.5rem);
      line-height: 1.05;
      max-width: 720px;
      letter-spacing: -0.01em;
    }

    p {
      color: #999;
      font-size: 1rem;
      max-width: 460px;
      margin: 24px 0 36px;
      line-height: 1.6;
    }

    a.home-link {
      color: #fff;
      text-decoration: none;
      border: 1.5px solid #fff;
      padding: 12px 28px;
      font-size: .82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .03em;
      transition: background .15s ease, color .15s ease;
    }

    a.home-link:hover { background: #fff; color: #000; }
  </style>
</head>

<body>
  <span class="eyebrow">Error 404</span>
  <h1>Esta página no existe</h1>
  <p>El contenido que buscás se movió o nunca estuvo acá. Volvé al inicio para ver nuestros proyectos y servicios.</p>
  <a href="/" class="home-link">Volver al inicio</a>
</body>

</html>
