<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel — HMA Estudio</title>

  <!-- El panel no se indexa. Ademas del robots.txt, esto lo saca de Google
       aunque alguien comparta el link. -->
  <meta name="robots" content="noindex, nofollow">

  <!-- La politica del sitio publico solo admite conexiones al propio dominio.
       El panel necesita hablar con Supabase, asi que la abre para ese destino y
       nada mas. El comodin es a proposito: la URL del proyecto no vive en el
       repo, esta en admin/config.js. -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">

  <link rel="icon" type="image/png" href="/assets/logo-mark.png">
  <link rel="stylesheet" href="/admin/admin.css">
</head>

<body>
  <main class="acceso">
    <div class="acceso__caja">
      <img src="/assets/logo-mark-black.png" alt="HMA" class="acceso__marca">

      <!-- Entrar -->
      <section id="vistaEntrar">
        <h1>Panel de obras</h1>
        <p class="acceso__ayuda">Entrá con tu correo y contraseña.</p>

        <form id="formEntrar" novalidate>
          <div class="campo">
            <label for="email">Correo</label>
            <input type="email" id="email" name="email" autocomplete="username" required
              autocapitalize="off" spellcheck="false">
          </div>
          <div class="campo">
            <label for="clave">Contraseña</label>
            <!-- El ojo es util de verdad aca: la contraseña la eligio otra
                 persona y se escribe una vez cada tanto, asi que escribirla a
                 ciegas y que rebote no dice si fue un dedazo o si esta mal. -->
            <div class="campo__clave">
              <input type="password" id="clave" name="clave" autocomplete="current-password" required>
              <button type="button" class="campo__ojo" id="verClave" aria-pressed="false"
                aria-label="Mostrar la contraseña">Mostrar</button>
            </div>
          </div>
          <button type="submit" class="boton" id="botonEntrar">Entrar</button>
          <p class="aviso" id="avisoEntrar" role="status" aria-live="polite"></p>
        </form>

        <button type="button" class="enlace" id="irARecuperar">Olvidé mi contraseña</button>
      </section>

      <!-- Recuperar -->
      <section id="vistaRecuperar" class="oculto">
        <h1>Recuperar contraseña</h1>
        <p class="acceso__ayuda">Te mandamos un enlace para elegir una nueva.</p>

        <form id="formRecuperar" novalidate>
          <div class="campo">
            <label for="emailRecuperar">Correo</label>
            <input type="email" id="emailRecuperar" name="emailRecuperar" autocomplete="username"
              required autocapitalize="off" spellcheck="false">
          </div>
          <button type="submit" class="boton" id="botonRecuperar">Enviar enlace</button>
          <p class="aviso" id="avisoRecuperar" role="status" aria-live="polite"></p>
        </form>

        <button type="button" class="enlace" id="volverAEntrar">Volver</button>
      </section>
    </div>
  </main>

  <script src="/admin/config.js"></script>
  <script src="/admin/api.js"></script>
  <script src="/admin/login.js"></script>
</body>

</html>
